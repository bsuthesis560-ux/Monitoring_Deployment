<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSU FaceRec — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3e;
      --accent:   #4f8ef7;
      --green:    #22c55e;
      --red:      #ef4444;
      --yellow:   #f59e0b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .logo {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 600; }
    header p  { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* ── Layout ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 13px; letter-spacing: .3px;
    }
    .card-body { padding: 18px; }

    /* ── Status badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge-green  { background: rgba(34,197,94,.15);  color: var(--green); }
    .badge-red    { background: rgba(239,68,68,.15);   color: var(--red); }
    .badge-yellow { background: rgba(245,158,11,.15);  color: var(--yellow); }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Buttons ── */
    .btn {
      padding: 8px 18px; border-radius: 7px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-danger   { background: var(--red);    color: #fff; }
    .btn-ghost    { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    /* ── Service control ── */
    #service-section { margin-bottom: 20px; }
    .service-row {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .service-info { flex: 1; }
    .service-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    #status-badge { margin-left: auto; }

    /* ── Log panel ── */
    #log-box {
      background: #0a0c14;
      border: 1px solid var(--border);
      border-radius: 7px;
      height: 260px;
      overflow-y: auto;
      padding: 10px 12px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #a0aec0;
    }
    #log-box .log-line { white-space: pre-wrap; word-break: break-all; }
    #log-box .log-line.info    { color: #90cdf4; }
    #log-box .log-line.warn    { color: var(--yellow); }
    #log-box .log-line.error   { color: var(--red); }
    #log-box .log-line.success { color: var(--green); }

    /* ── Camera streams ── */
    .stream-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 14px; }
    .stream-card {
      background: #0a0c14;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .stream-card .stream-name {
      padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px;
    }
    .stream-card img {
      width: 100%; display: block;
      aspect-ratio: 16/9; object-fit: cover;
      background: #0a0c14;
    }
    #no-streams { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

    /* ── Camera config ── */
    .cam-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .cam-row-header {
      background: #13151f;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 13px;
    }
    .cam-row-body { padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .cam-row-body { grid-template-columns: 1fr; } }

    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
    .field input {
      width: 100%; padding: 7px 10px;
      background: #0a0c14; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: var(--accent); }

    .global-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    @media (max-width: 600px) { .global-fields { grid-template-columns: 1fr; } }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 18px;
      font-size: 13px; color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      transform: translateY(80px); opacity: 0;
      transition: transform .25s, opacity .25s;
      z-index: 999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok  { border-left: 3px solid var(--green); }
    #toast.err { border-left: 3px solid var(--red); }

    /* ── Misc ── */
    .section-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 14px; }
    .mt-4 { margin-top: 16px; }
    .flex-end { display: flex; justify-content: flex-end; gap: 8px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .icon { font-size: 15px; }
  </style>
</head>
<body>

<header>
  <div class="logo">B</div>
  <div>
    <h1>BSU FaceRec Dashboard</h1>
    <p>YOLOv8 · FaceNet · DeepSORT — Multi-Camera Edition</p>
  </div>
  <div id="status-badge" class="badge badge-yellow">
    <span class="dot"></span> Checking…
  </div>
</header>

<div class="container">

  <!-- ── Service Control ── -->
  <div class="card" id="service-section">
    <div class="card-header"><span class="icon">⚙️</span> Recognition Service</div>
    <div class="card-body">
      <div class="service-row">
        <div class="service-info">
          <div class="service-label">Status</div>
          <div id="status-text" style="font-weight:600;">Checking…</div>
        </div>
        <button class="btn btn-primary" id="btn-start" onclick="startService()">▶ Start</button>
        <button class="btn btn-danger"  id="btn-stop"  onclick="stopService()">■ Stop</button>
      </div>
    </div>
  </div>

  <!-- ── Streams + Logs ── -->
  <div class="grid-2" style="margin-bottom:20px;">

    <!-- Live Streams -->
    <div class="card">
      <div class="card-header">
        <span class="icon">📷</span> Live Camera Feeds
        <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="loadStreams()">↻ Refresh</button>
      </div>
      <div class="card-body">
        <div id="stream-container">
          <div id="no-streams">Service not running or no cameras connected.</div>
        </div>
      </div>
    </div>

    <!-- Logs -->
    <div class="card">
      <div class="card-header">
        <span class="icon">📋</span> Service Log
        <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="clearLog()">Clear</button>
      </div>
      <div class="card-body">
        <div id="log-box"></div>
      </div>
    </div>

  </div>

  <!-- ── Camera Configuration ── -->
  <div class="card">
    <div class="card-header"><span class="icon">🎛️</span> Camera Configuration</div>
    <div class="card-body">

      <div class="global-fields">
        <div class="field">
          <label>API URL</label>
          <input type="text" id="api_url" placeholder="https://your-app.replit.app" />
        </div>
        <div class="field">
          <label>API Key</label>
          <input type="password" id="api_key" placeholder="your-api-key" />
        </div>
        <div class="field">
          <label>YOLO Image Size</label>
          <input type="number" id="yolo_imgsz" value="640" min="320" max="1280" step="32" />
        </div>
      </div>

      <hr class="divider" />

      <div class="section-title">Cameras</div>
      <div id="cameras-list"></div>

      <div class="flex-end mt-4">
        <button class="btn btn-ghost" onclick="addCamera()">+ Add Camera</button>
        <button class="btn btn-primary" onclick="saveCameras()">💾 Save Configuration</button>
      </div>

    </div>
  </div>

</div>

<div id="toast"></div>

<script>
  const STREAM_PORT = {{ stream_port }};
  let cameraData = [];
  let sseSource  = null;
  let autoScroll = true;

  // ── Status polling ──────────────────────────────────────────────────────────
  async function pollStatus() {
    try {
      const r = await fetch('/api/service/status');
      const d = await r.json();
      setStatus(d.running);
    } catch { setStatus(false); }
  }

  function setStatus(running) {
    const badge = document.getElementById('status-badge');
    const text  = document.getElementById('status-text');
    if (running) {
      badge.className  = 'badge badge-green';
      badge.innerHTML  = '<span class="dot"></span> Running';
      text.textContent = 'Recognition service is active';
      loadStreams();
    } else {
      badge.className  = 'badge badge-red';
      badge.innerHTML  = '<span class="dot"></span> Stopped';
      text.textContent = 'Recognition service is not running';
      document.getElementById('stream-container').innerHTML =
        '<div id="no-streams">Service not running or no cameras connected.</div>';
    }
  }

  // ── Service start / stop ────────────────────────────────────────────────────
  async function startService() {
    document.getElementById('btn-start').disabled = true;
    const r = await fetch('/api/service/start', { method: 'POST' });
    const d = await r.json();
    toast(d.message, d.ok);
    document.getElementById('btn-start').disabled = false;
    setTimeout(pollStatus, 2000);
  }

  async function stopService() {
    document.getElementById('btn-stop').disabled = true;
    const r = await fetch('/api/service/stop', { method: 'POST' });
    const d = await r.json();
    toast(d.message, d.ok);
    document.getElementById('btn-stop').disabled = false;
    setTimeout(pollStatus, 1000);
  }

  // ── SSE log streaming ───────────────────────────────────────────────────────
  function connectSSE() {
    if (sseSource) sseSource.close();
    sseSource = new EventSource('/api/service/logs/stream');
    sseSource.onmessage = e => {
      appendLog(JSON.parse(e.data));
    };
    sseSource.onerror = () => {
      setTimeout(connectSSE, 3000);
    };
  }

  function appendLog(line) {
    const box = document.getElementById('log-box');
    const div = document.createElement('div');
    div.className = 'log-line ' + classifyLog(line);
    div.textContent = line;
    box.appendChild(div);
    if (autoScroll) box.scrollTop = box.scrollHeight;
    // keep at most 500 lines
    while (box.children.length > 500) box.removeChild(box.firstChild);
  }

  function classifyLog(line) {
    const l = line.toLowerCase();
    if (l.includes('error') || l.includes('failed') || l.includes('traceback')) return 'error';
    if (l.includes('warning') || l.includes('warn'))  return 'warn';
    if (l.includes('logged') || l.includes('confirmed') || l.includes('connected')) return 'success';
    if (l.includes('info') || l.includes('starting') || l.includes('loading')) return 'info';
    return '';
  }

  function clearLog() {
    document.getElementById('log-box').innerHTML = '';
  }

  // ── Live streams ────────────────────────────────────────────────────────────
  async function loadStreams() {
    try {
      const r  = await fetch(`http://localhost:${STREAM_PORT}/cameras`);
      const cameras = await r.json();
      renderStreams(cameras);
    } catch {
      // service not streaming yet
    }
  }

  function renderStreams(cameras) {
    const container = document.getElementById('stream-container');
    if (!cameras || cameras.length === 0) {
      container.innerHTML = '<div id="no-streams">No active camera streams found.</div>';
      return;
    }
    container.innerHTML = '<div class="stream-grid"></div>';
    const grid = container.querySelector('.stream-grid');
    cameras.forEach(name => {
      const card = document.createElement('div');
      card.className = 'stream-card';
      const encoded = encodeURIComponent(name);
      card.innerHTML = `
        <div class="stream-name"><span>📷</span> ${escHtml(name)}</div>
        <img src="http://localhost:${STREAM_PORT}/stream/${encoded}"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22><rect fill=%22%230a0c14%22 width=%22320%22 height=%22180%22/><text x=%22160%22 y=%22100%22 fill=%22%2364748b%22 text-anchor=%22middle%22 font-size=%2214%22>No feed</text></svg>'"
             alt="${escHtml(name)}" />
      `;
      grid.appendChild(card);
    });
  }

  // ── Camera config ───────────────────────────────────────────────────────────
  async function loadConfig() {
    try {
      const r = await fetch('/api/cameras');
      const d = await r.json();
      document.getElementById('api_url').value    = d.api_url    || '';
      document.getElementById('api_key').value    = d.api_key    || '';
      document.getElementById('yolo_imgsz').value = d.yolo_imgsz || '640';
      cameraData = d.cameras || [];
      renderCameras();
    } catch (e) { console.error(e); }
  }

  function renderCameras() {
    const list = document.getElementById('cameras-list');
    list.innerHTML = '';
    cameraData.forEach((cam, i) => {
      const row = document.createElement('div');
      row.className = 'cam-row';
      row.innerHTML = `
        <div class="cam-row-header">
          <span style="color:var(--accent);">CAM${cam.index}</span>
          <span>${escHtml(cam.name)}</span>
          <button class="btn btn-ghost btn-sm" style="margin-left:auto;color:var(--red);border-color:var(--red);"
                  onclick="removeCamera(${i})">✕ Remove</button>
        </div>
        <div class="cam-row-body">
          <div class="field"><label>Name</label>
            <input type="text" data-i="${i}" data-f="name" value="${escHtml(cam.name)}" oninput="updateCam(this)" /></div>
          <div class="field"><label>IP Address</label>
            <input type="text" data-i="${i}" data-f="ip" value="${escHtml(cam.ip)}" oninput="updateCam(this)" /></div>
          <div class="field"><label>Username</label>
            <input type="text" data-i="${i}" data-f="user" value="${escHtml(cam.user)}" oninput="updateCam(this)" /></div>
          <div class="field"><label>Password</label>
            <input type="password" data-i="${i}" data-f="pass" value="" placeholder="(unchanged)" oninput="updateCam(this)" /></div>
          <div class="field"><label>Port</label>
            <input type="number" data-i="${i}" data-f="port" value="${escHtml(cam.port)}" oninput="updateCam(this)" /></div>
          <div class="field"><label>Stream Path</label>
            <input type="text" data-i="${i}" data-f="stream_path" value="${escHtml(cam.stream_path)}" oninput="updateCam(this)" /></div>
        </div>
      `;
      list.appendChild(row);
    });
    if (cameraData.length === 0) {
      list.innerHTML = '<p style="color:var(--muted);font-size:13px;">No cameras configured. Click "+ Add Camera" to add one.</p>';
    }
  }

  function updateCam(el) {
    const i = parseInt(el.dataset.i);
    const f = el.dataset.f;
    cameraData[i][f] = el.value;
    if (f === 'name') renderCameras();  // refresh header label
  }

  function addCamera() {
    const maxIdx = cameraData.reduce((m, c) => Math.max(m, c.index), 0);
    cameraData.push({ index: maxIdx + 1, name: `Camera ${maxIdx + 1}`, ip: '', user: 'admin', pass: '', port: '554', stream_path: '/Streaming/Channels/101' });
    renderCameras();
  }

  function removeCamera(i) {
    cameraData.splice(i, 1);
    // re-index
    cameraData.forEach((c, idx) => c.index = idx + 1);
    renderCameras();
  }

  async function saveCameras() {
    const payload = {
      api_url:    document.getElementById('api_url').value.trim(),
      api_key:    document.getElementById('api_key').value.trim(),
      yolo_imgsz: document.getElementById('yolo_imgsz').value,
      cameras:    cameraData,
    };
    try {
      const r = await fetch('/api/cameras', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const d = await r.json();
      toast(d.ok ? 'Configuration saved.' : 'Save failed.', d.ok);
    } catch { toast('Save failed.', false); }
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let _toastTimer;
  function toast(msg, ok) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = 'show ' + (ok ? 'ok' : 'err');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ''; }, 3500);
  }

  // ── Init ────────────────────────────────────────────────────────────────────
  pollStatus();
  loadConfig();
  connectSSE();
  setInterval(pollStatus, 8000);
  setInterval(loadStreams, 10000);
</script>
</body>
</html>
