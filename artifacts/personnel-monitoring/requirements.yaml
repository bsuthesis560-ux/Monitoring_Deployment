packages:
  "framer-motion": "For page transitions and smooth UI animations"
  "react-hook-form": "For robust form state management and validation"
  "@hookform/resolvers": "Zod resolver for form validation"
  "date-fns": "For formatting dates and times in the monitoring table"
  "clsx": "For conditional class name merging"
  "tailwind-merge": "For merging tailwind classes safely"
  "@tanstack/react-table": "For robust data tables"

images:
  - path: "artifacts/personnel-monitoring/public/images/bsu-bg.png"
    description: "Abstract minimal background with subtle deep red and blue geometric shapes, institutional and professional, very light, suitable for a login page background"
    aspect_ratio: "16:9"

notes:
  - "The application uses React Query hooks generated by Orval from the OpenAPI spec."
  - "Auth state is managed globally via a custom context that calls the /api/auth/me endpoint."
  - "Roles ('admin' and 'user') dictate route access and default redirects."
